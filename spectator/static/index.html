<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>杭麻 Bot · 本地观战器</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">只读 · 本机 · P0</p>
        <h1>杭麻 Bot 观战器</h1>
      </div>
      <div id="connection" class="connection">正在读取审计目录…</div>
    </header>

    <main>
      <section class="selectors" aria-label="观战来源与官方场次选择">
        <label>Token 身份
          <select id="source-select" disabled></select>
        </label>
        <label>官方场次
          <select id="game-select" disabled></select>
        </label>
        <button id="refresh-button" type="button">立即刷新</button>
      </section>

      <section id="empty-state" class="empty-state">
        未识别到审计运行目录。请检查 <code>--watch-dir</code> 是否指向运行目录、
        <code>audit_root</code> 或测试房间 slot 的父目录。
      </section>

      <section id="game-view" hidden>
        <section class="game-summary">
          <div>
            <p class="eyebrow">官方场次</p>
            <h2 id="game-title">—</h2>
          </div>
          <div id="freshness" class="freshness"></div>
        </section>

        <section id="warning" class="warning" hidden></section>

        <section class="score-grid" aria-label="桌内积分，座位顺序 0 到 3">
          <article class="score-card"><span>座位 0</span><strong id="score-0">—</strong></article>
          <article class="score-card"><span>座位 1</span><strong id="score-1">—</strong></article>
          <article class="score-card"><span>座位 2</span><strong id="score-2">—</strong></article>
          <article class="score-card"><span>座位 3</span><strong id="score-3">—</strong></article>
        </section>

        <section class="board-grid">
          <article class="panel hand-panel">
            <div class="panel-heading"><h3>本家手牌</h3><span id="my-seat" class="badge">—</span></div>
            <div id="my-hand" class="tiles" aria-label="本家手牌"></div>
            <p id="drawn-tile" class="muted"></p>
            <dl id="rule-state" class="facts"></dl>
          </article>

          <article class="panel table-panel">
            <div class="panel-heading"><h3>牌桌公开信息</h3><span id="turn-state" class="badge">—</span></div>
            <dl id="table-facts" class="facts"></dl>
            <div id="melds" class="melds"></div>
          </article>
        </section>

        <section class="panel">
          <div class="panel-heading"><h3>四家牌河</h3><span class="muted">座位顺序 0—3</span></div>
          <div id="discards" class="rivers"></div>
        </section>

        <section class="panel">
          <div class="panel-heading"><h3>本次决策提示</h3><span class="muted">仅展示规则模块当时已产生的事实</span></div>
          <div id="candidates" class="candidates"></div>
        </section>

        <section class="two-column">
          <article class="panel">
            <div class="panel-heading"><h3>最新提交</h3></div>
            <div id="submission" class="muted">暂无提交审计。</div>
          </article>
          <article class="panel">
            <div class="panel-heading"><h3>最新增量事件</h3><span class="muted">未用事件猜造完整牌桌</span></div>
            <ol id="events" class="events"></ol>
          </article>
        </section>
      </section>

      <section id="issues" class="issues" hidden></section>
    </main>

    <footer>观战器只读取已写入的审计记录；不会请求官方平台，也不能提交动作。</footer>
    <script src="/app.js"></script>
  </body>
</html>
